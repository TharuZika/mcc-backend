    unauthorized: "Unauthorized - No token provided"
    token-expired: "Token has expired"
    invalid-token: "Unauthorized - Invalid token"
  success:
    valid-token: "Valid token"

application:
  cors-allow-origins: "http://localhost:3000,http://localhost:3001"

  gcp:
    project-id: mcc-rental-system
